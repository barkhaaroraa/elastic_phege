[project]
name = "phageforge"
version = "0.1.0"
description = "Hybrid retrieval funnel for phage-host discovery, built on Elasticsearch"
requires-python = ">=3.12,<3.13"

dependencies = [
    "elasticsearch>=9.0,<10.0",
    "numpy>=1.26",
    "pandas>=2.2",
    "biopython>=1.83",
    "fair-esm>=2.0.0",
    "torch>=2.2",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
    "requests>=2.32",
    "tqdm>=4.66",
    "scikit-learn>=1.4",
]

[project.optional-dependencies]
# httpx backs starlette's TestClient; without it the API tests cannot import.
dev = ["pytest>=8.0", "pytest-asyncio>=0.23", "ruff>=0.5", "httpx>=0.27"]

# This host has no GPU. The default PyPI `torch` wheel drags in ~2 GB of CUDA
# libraries that would never be loaded, so torch is pinned to the CPU-only index.
[tool.uv.sources]
torch = { index = "pytorch-cpu" }

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/phageforge"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py312"

# `def endpoint(client = Depends(get_es))` is how FastAPI declares a dependency;
# the call in the default is the framework's documented idiom, not the mutable
# -default bug B008 exists to catch. Same for Query, which carries validation.
[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["fastapi.Depends", "fastapi.Query", "fastapi.Path", "fastapi.Body"]
